# このconfigは、 dockerでMisskey本体を起動せず、 redisとpostgresql などだけを起動します

services:
  valkey:
    restart: always
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/valkey:/data

  db:
    restart: always
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    env_file:
      - .config/docker.env
    volumes:
      - ./data/db:/var/lib/postgresql
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      retries: 20


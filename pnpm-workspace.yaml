packages:
  - packages/backend
  - packages/frontend-shared
  - packages/frontend
  - packages/frontend-builder
  - packages/frontend-embed
  - packages/i18n
  - packages/icons-subsetter
  - packages/sw
  - packages/misskey-js
  - packages/misskey-js/generator
  - packages/misskey-reversi
  - packages/misskey-bubble-game
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry/profiling-node': true
  '@sentry-internal/node-cpu-profiler': true
  '@tensorflow/tfjs-node': true
  bufferutil: true
  canvas: true
  core-js: true
  cypress: true
  esbuild: true
  libpq: true
  msgpackr-extract: true
  msw: true
  nice-napi: true
  protobufjs: true
  re2: true
  sharp: true
  utf-8-validate: true
  v-code-diff: true
  vue-demi: true
  exifreader: false
minimumReleaseAge: 10080 # delay 7days to mitigate supply-chain attack
minimumReleaseAgeExclude:
  - '@misskey-dev/*'
  - '@syuilo/aiscript'
  - buraha
  - mfm-js
  - slacc
  - slacc-android-arm-eabi
  - slacc-android-arm64
  - slacc-darwin-arm64
  - slacc-darwin-universal
  - slacc-darwin-x64
  - slacc-freebsd-x64
  - slacc-linux-arm-gnueabihf
  - slacc-linux-arm64-gnu
  - slacc-linux-arm64-musl
  - slacc-linux-x64-gnu
  - slacc-linux-x64-musl
  - slacc-win32-arm64-msvc
  - slacc-win32-x64-msvc
  - '@typescript/native-preview*'
  - pnpm
  - re2 # そのうち消す
  - nan # そのうち消す
  - systeminformation # 脆弱性対応。そのうち消す
  - sanitize-html # 脆弱性対応。そのうち消す
  - launder # 脆弱性対応。そのうち消す
  # Renovate security update: ws@8.20.1
  - ws@8.20.1
overrides:
  '@aiscript-dev/aiscript-languageserver': '-'
  '@peculiar/asn1-ecc': 2.6.1
  '@peculiar/asn1-rsa': 2.6.1
  '@peculiar/asn1-schema': 2.6.0
  '@peculiar/asn1-x509': 2.6.1
  '@tensorflow/tfjs': 4.22.0
  '@tensorflow/tfjs-core': 4.22.0
  '@tensorflow/tfjs-node': 4.22.0
  chokidar: 5.0.0
  lodash: 4.18.1

patchedDependencies:
  '@misskey-dev/summaly@5.3.0': patches/@misskey-dev__summaly@5.3.0.patch
  pg-pool@3.11.0: patches/pg-pool@3.11.0.patch
  typeorm: patches/typeorm.patch
engineStrict: true
saveExact: true
shellEmulator: true
